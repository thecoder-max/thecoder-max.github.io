<!-- transfer.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentBank | Transfer Money</title>
</head>
<body style="margin:0; font-family:'Segoe UI', sans-serif; background:#f0f7ff;">
<div style="max-width:1000px; margin:0 auto; padding:20px;">
    <div style="background:#0a2b3e; padding:15px 25px; border-radius:28px; margin-bottom:30px; display:flex; flex-wrap:wrap; justify-content:space-between;">
        <span style="font-size:28px; font-weight:800; color:#ffcd3c;">📘 StudentBank</span>
        <div style="display:flex; gap:15px;">
            <a href="index.html" style="color:white; text-decoration:none;">Home</a> <a href="accounts.html" style="color:white;">Accounts</a> <a href="transfer.html" style="color:#ffcd3c; font-weight:bold;">Transfer</a> <a href="transactions.html" style="color:white;">History</a> <a href="savings.html" style="color:white;">Savings</a> <a href="scholarships.html" style="color:white;">Scholarships</a> <a href="budget.html" style="color:white;">Budget</a> <a href="profile.html" style="color:white;">Profile</a>
        </div>
    </div>
    <div style="background:white; border-radius:32px; padding:35px;">
        <h2 style="margin:0 0 8px 0;">💸 Send Money Instantly</h2>
        <p style="color:#5c6f87;">Transfer to friends, family, or pay bills</p>
        <div style="margin:30px 0;">
            <label style="font-weight:600;">Recipient (Email or Student ID)</label><br>
            <input type="text" placeholder="e.g., jasmine.c@student.edu" style="width:100%; padding:14px; margin-top:8px; border-radius:18px; border:1px solid #ccc; font-size:16px;">
        </div>
        <div style="margin:25px 0;">
            <label style="font-weight:600;">Amount (USD)</label><br>
            <input type="number" placeholder="0.00" style="width:100%; padding:14px; margin-top:8px; border-radius:18px; border:1px solid #ccc;">
        </div>
        <div style="margin:25px 0;">
            <label style="font-weight:600;">From Account</label><br>
            <select style="width:100%; padding:14px; border-radius:18px; margin-top:8px;">
                <option>Student Checking (****4321) - $1,245.80</option>
                <option>Smart Savings (****9876) - $620.50</option>
            </select>
        </div>
        <div style="margin:25px 0;">
            <label style="font-weight:600;">Description (optional)</label>
            <input type="text" placeholder="e.g., Rent / Group dinner" style="width:100%; padding:14px; border-radius:18px; border:1px solid #ccc;">
        </div>
        <button style="background:#0a2b3e; color:white; padding:14px 30px; border:none; border-radius:40px; font-weight:bold; font-size:16px; cursor:pointer;">✔️ Review Transfer</button>
        <div style="margin-top:20px; background:#f9f2e0; padding:12px; border-radius:20px;"><span>✨ Student tip: Transfers under $50 are free, above $50 only $0.25 fee</span></div>
    </div>
    <div style="margin-top:30px; text-align:center;">© StudentBank – Frontend Demo</div>
</div>
</body>
</html>
